[workspace]
members = ["crates/*"]
exclude = ["vendor/gpui-0.2.2", "vendor/proc-macro-error2-2.0.1"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rap-core = { path = "crates/rap-core" }
rap-platform = { path = "crates/rap-platform" }
rap-library = { path = "crates/rap-library" }
rap-audio = { path = "crates/rap-audio" }

[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }
proc-macro-error2 = { path = "vendor/proc-macro-error2-2.0.1" }
