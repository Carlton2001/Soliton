[workspace]
members = ["crates/*"]
exclude = ["vendor/gpui-0.2.2", "vendor/proc-macro-error2-2.0.1", "vendor/xattr-0.2.3"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soliton-core = { path = "crates/soliton-core" }
soliton-platform = { path = "crates/soliton-platform" }
soliton-library = { path = "crates/soliton-library" }
soliton-audio = { path = "crates/soliton-audio" }
soliton-network = { path = "crates/soliton-network" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Line tables in a separate file (PDB on Windows, .dwp on Linux); shipped
# binaries stay free of debug information.
debug = "line-tables-only"
split-debuginfo = "packed"

[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }
proc-macro-error2 = { path = "vendor/proc-macro-error2-2.0.1" }
xattr = { path = "vendor/xattr-0.2.3" }
