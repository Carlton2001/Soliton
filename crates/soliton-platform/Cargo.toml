[package]
name = "soliton-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
dirs = "7"
soliton-core.workspace = true
crossbeam-channel = "0.5"
raw-window-handle = "0.6"
base64 = "0.22"
minisign-verify = "0.2"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "=0.45.1", default-features = false }
windows-registry = "=0.5.3"
windows-collections = "=0.2.0"
windows-future = "=0.2.1"
windows = { version = "=0.61.3", features = [
    "UI_ViewManagement", "Foundation", "Devices_Bluetooth", "Devices_Enumeration", "Media_Devices",
    "Media", "Media_Control", "Storage", "Storage_Streams",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_LibraryLoader",
    "Win32_Networking_WinHttp",
    "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
