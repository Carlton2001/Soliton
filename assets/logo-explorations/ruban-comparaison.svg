<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">RAP — Impulsion et ruban / Pulse and ribbon</title><desc id="desc">Comparaison du ruban original et renforcé avec l’impulsion, à 16, 24, 32 et 48 pixels. Actual-size comparison of three icon options.</desc><rect width="1120" height="660" fill="#101112"/><text x="40" y="53" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#F6F6F6" font-weight="650">RAP / Impulsion ou ruban</text><text x="40" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#AFB5BD" font-weight="400">Le ruban renforcé garde la forme initiale et gagne en présence à petite taille.</text><defs><symbol id="icon-0" viewBox="0 0 256 256"><rect width="256" height="256" rx="55" fill="#E52232"/><g fill="#FFFFFF"><rect x="48" y="102" width="28" height="52" rx="14"/><rect x="92" y="56" width="28" height="144" rx="14"/><rect x="136" y="78" width="28" height="100" rx="14"/><rect x="180" y="110" width="28" height="36" rx="14"/></g></symbol><symbol id="icon-1" viewBox="0 0 256 256"><rect width="256" height="256" rx="55" fill="#E52232"/><g fill="none" stroke="#FFFFFF" stroke-width="25" stroke-linecap="round"><path d="M58 102C95 52 161 152 198 102"/><path d="M58 154C95 104 161 204 198 154"/></g></symbol><symbol id="icon-2" viewBox="0 0 256 256"><rect width="256" height="256" rx="55" fill="#E52232"/><g fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"><path d="M58 102C95 52 161 152 198 102"/><path d="M58 154C95 104 161 204 198 154"/></g></symbol></defs><rect x="40" y="118" width="340" height="492" rx="20" fill="#1C1E21" stroke="#303338"/><text x="64" y="157" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#F6F6F6" font-weight="600">2 / Impulsion</text><use href="#icon-0" x="134" y="185" width="152" height="152"/><text x="64" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8E98A3" font-weigh