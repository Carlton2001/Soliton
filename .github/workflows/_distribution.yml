name: Windows distribution (reusable)
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SOLITON_UPDATE_REPOSITORY: ${{ github.repository }}
      SOLITON_UPDATE_PUBLIC_KEY: ${{ vars.SOLITON_UPDATE_PUBLIC_KEY }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-distribution
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build setup and portable ZIP with notices
        shell: pwsh
        run: ./scripts/build-distribution.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Soliton-windows-x64
          path: target/distribution/output/*
          if-no-files-found: error
          compression-level: 0
