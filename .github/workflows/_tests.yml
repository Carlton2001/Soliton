name: Windows native tests (reusable)
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Select Rust
        run: rustup override set 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rap-windows-native-v1
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Format
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Unit and integration tests
        run: cargo test --workspace --locked
      - name: Script tests
        shell: pwsh
        run: |
          ./scripts/tests/check-third-party-licenses.tests.ps1
          ./scripts/tests/update-manifest.tests.ps1
          ./scripts/tests/distribution.tests.ps1
      # Hardware tests remain explicit local checks; hosted runners have no audio receiver.
