# Adapted from Oxyde-GPUI (Carlton2001, GPL-3.0).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --offline --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Cargo metadata.' }
          $version = (($metadata | ConvertFrom-Json).packages | Where-Object name -eq 'soliton-app').version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or "v$version" -ne $env:GITHUB_REF_NAME) { throw 'Release tag does not match Cargo version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
  tests:
    needs: version
    uses: ./.github/workflows/_tests.yml
  audit:
    needs: version
    uses: ./.github/workflows/_audit.yml
  distribution:
    needs: version
    uses: ./.github/workflows/_distribution.yml
  linux:
    needs: version
    uses: ./.github/workflows/_linux-distribution.yml
  release:
    needs: [version, tests, audit, distribution, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Soliton-*
          merge-multiple: true
          path: target/distribution/output
      - name: Install signing tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign rpm
      - name: Sign packages
        env:
          SOLITON_UPDATE_PRIVATE_KEY: ${{ secrets.SOLITON_UPDATE_PRIVATE_KEY }}
          SOLITON_UPDATE_PRIVATE_KEY_PASSWORD: ${{ secrets.SOLITON_UPDATE_PRIVATE_KEY_PASSWORD }}
          SOLITON_GPG_PRIVATE_KEY: ${{ secrets.SOLITON_GPG_PRIVATE_KEY }}
          SOLITON_GPG_PASSPHRASE: ${{ secrets.SOLITON_GPG_PASSPHRASE }}
          SOLITON_UPDATE_PUBLIC_KEY: ${{ vars.SOLITON_UPDATE_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: sh scripts/sign-release.sh "$RELEASE_VERSION" target/distribution/output
      - name: Write update manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $setup = "target/distribution/output/Soliton_$($env:RELEASE_VERSION)_x64-setup.exe"
          ./scripts/write-update-manifest.ps1 -Version $env:RELEASE_VERSION -Setup $setup -Repository $env:GITHUB_REPOSITORY -Destination target/distribution/output/latest.json
      - name: Write the Flathub manifest
        run: sh scripts/flathub-manifest.sh "$GITHUB_REF_NAME" target/flathub
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Soliton v$RELEASE_VERSION" --generate-notes \
            target/distribution/output/* installer/signing/soliton-packages.asc \
            target/flathub/*
