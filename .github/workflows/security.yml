name: Windows dependency security
on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml', Cargo.toml, Cargo.lock, 'scripts/*audit*.ps1', '.github/workflows/*audit*', .github/workflows/security.yml]
  pull_request:
    paths: ['**/Cargo.toml', Cargo.toml, Cargo.lock, 'scripts/*audit*.ps1', '.github/workflows/*audit*', .github/workflows/security.yml]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rustsec:
    uses: ./.github/workflows/_audit.yml
