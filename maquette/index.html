<!doctype html>
<html lang="fr" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAP — Votre musique, simplement.</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="titlebar"><div class="brand">rap<span>LECTEUR AUDIO</span></div><div class="title-note">Votre musique, simplement.</div><button id="theme" class="theme">Passer au thème clair</button><div class="window" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div></header>
<div class="shell"><aside><div class="section-label">BIBLIOTHÈQUE</div><nav id="nav"></nav><div class="collection"><span class="status-dot"></span> Collection locale<small>Tout est à jour</small></div><section class="player"><div class="section-label">MINI LECTEUR <span id="playing-state">EN PAUSE</span></div><div id="now-art" class="art mini"></div><h3 id="now-title"></h3><p id="now-artist"></p><div class="transport"><button id="shuffle" title="Lecture aléatoire" aria-label="Lecture aléatoire"></button><button id="prev" title="Piste précédente" aria-label="Piste précédente"></button><button id="play" class="play" title="Lire ou mettre en pause" aria-label="Lire ou mettre en pause"></button><button id="next" title="Piste suivante" aria-label="Piste suivante"></button><button id="repeat" title="Répéter" aria-label="Répéter"></button></div><input id="progress" aria-label="Position de lecture" type="range" min="0" max="240" value="0"><div class="times"><span id="elapsed">0:00</span><span id="duration">4:00</span></div><div class="volume"><img src="../assets/icons/volume-2.svg" alt=""><input id="volume" type="range" aria-label="Volume" value="70"><span id="volume-value">70 %</span></div><p class="demo">Lecture simulée · Maquette locale</p></section></aside><main><div class="topline"><div id="breadcrumb">Bibliothèque / Artistes</div><label class="search"><img src="../assets/icons/search.svg" alt=""><input id="search" placeholder="Rechercher dans la collection" aria-label="Rechercher dans la collection"><kbd>/</kbd></label></div><div id="content"></div></main><section class="queue-panel"><div class="queue-heading"><h3>File de lecture <span id="queue-count"></span></h3><button id="clear" title="Vider la file">Vider</button></div><p class="queue-sub">VOTRE SÉLECTION</p><div id="queue"></div><div class="queue-footer" id="queue-footer"></div></section></div><div id="toast" role="status"></div><script src="app.js"></script>
</body></html>
