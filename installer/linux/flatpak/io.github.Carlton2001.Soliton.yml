# Flatpak manifest, built from the committed sources by scripts/build-flatpak.sh.
# Permissions stay minimal and read-only: the music folder and mount points are
# visible with their real paths, so file notifications and availability checks
# work; any other folder is granted through the file chooser portal.
id: io.github.Carlton2001.Soliton
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang for the PipeWire bindings generated by bindgen.
  - org.freedesktop.Sdk.Extension.llvm22
command: soliton
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPUI renders through Vulkan.
  - --device=dri
  # Libraries, read only. Removable disks, then fixed mounts and NAS shares.
  - --filesystem=xdg-music:ro
  - --filesystem=/run/media:ro
  - --filesystem=/media:ro
  - --filesystem=/mnt:ro
  # Native PipeWire playback.
  - --filesystem=xdg-run/pipewire-0
  # Google Cast and DLNA discovery and streaming on the local network.
  - --share=network
  # MPRIS, and the name a second instance takes.
  - --own-name=org.mpris.MediaPlayer2.soliton
  - --own-name=org.mpris.MediaPlayer2.soliton.*
modules:
  - name: soliton
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        CARGO_HOME: /run/build/soliton/cargo
        CARGO_NET_OFFLINE: 'true'
        LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
    build-commands:
      - cargo build --offline --locked --release -p soliton-app --bin Soliton
      - install -Dm755 -s target/release/Soliton /app/bin/soliton
      # The per-user marker would let Soliton rewrite the icon; this entry stays fixed.
      - sed -e 's/^Exec=@EXEC@$/Exec=soliton/' -e '/^X-Soliton-Install=user$/d'
        installer/linux/${FLATPAK_ID}.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 installer/linux/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 assets/logos/graphite-mint.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 LICENSE /app/share/licenses/${FLATPAK_ID}/LICENSE
      - cp -R licenses/dependencies /app/share/licenses/${FLATPAK_ID}/dependencies
    sources:
      # The last commit of main; a release points to the tag and its commit instead.
      - type: git
        path: ../../..
        branch: main
      - cargo-sources.json
